<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <button command="show-modal" commandfor="book-dialog" class="newBookBtn">New Book</button>
<dialog id="book-dialog">
      <form class="newBook">

        <label for="bookAuthor">author</label>
        <input type="text" id="bookAuthor">

        <label for="bookTitle">Book title</label>
        <input type="text" id="bookTitle">

        <label for="bookPages">No. of Pages</label>
        <input type="number" id="bookPages">

        <label for="bookRead">Have you read the book?</label>
        <input type="checkbox" id = "bookRead">

        <button type="submit" class="submit">submit</button>
    </form>
  <button commandfor="book-dialog" command="close">Close</button>

</dialog>
<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Pages</th>
        <th>Remove</th>
        <th>Read</th>
    </tr>
    </thead>
    <tbody>

    </tbody>

</table>

</body>
</html>
